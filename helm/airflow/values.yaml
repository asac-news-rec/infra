# Airflow 공식 Helm 차트(apache-airflow/airflow 1.22.0, Airflow 3.2.2) 설치 값. 이슈 #35.
# 실행: helm/airflow/README.md 참고. 비공개 클러스터(NAT 없는 경우 포함)에서 받을 수 있도록
# 이미지는 모두 우리 Artifact Registry 주소로 바꿔 둔다.

# 작업을 스케줄러 파드 안에서 실행한다. 각 작업의 코드는 KubernetesPodOperator로 별도 파드에서 돈다.
# (기본값 CeleryExecutor는 redis와 worker가 따로 필요해서 무겁다.)
executor: LocalExecutor

# 지표 수집(statsd)과 redis는 쓰지 않는다. (quay.io 이미지가 필요해서 끈다.)
statsd:
  enabled: false
redis:
  enabled: false

images:
  airflow:
    repository: asia-northeast3-docker.pkg.dev/final-project-513508/dockerhub-mirror/apache/airflow
    tag: "3.2.2"
  gitSync:
    # registry.k8s.io 이미지를 news-rec 저장소로 복사한 것(11/16).
    repository: asia-northeast3-docker.pkg.dev/final-project-513508/news-rec/git-sync
    tag: v4.4.2

# 차트에 들어 있는 PostgreSQL(Airflow 메타데이터 저장). 갱신이 끝난 bitnamilegacy 이미지라
# 학습용으로만 쓰고, 나중에 Cloud SQL로 바꾼다.
postgresql:
  image:
    registry: asia-northeast3-docker.pkg.dev
    repository: final-project-513508/dockerhub-mirror/bitnamilegacy/postgresql

# Airflow 서비스 계정이 작업 파드를 만들 수 있게 하는 Role/RoleBinding을 차트가 만든다.
# 11/16에는 베스천 계정에 만들 권한이 없어 false로 설치했고, 11/17에 베스천 권한을 주어(이슈 #43) true로 바꿨다.
rbac:
  create: true

# 로그 디스크 기본값이 각각 100Gi라서 서울 리전 SSD 한도(SSD_TOTAL_GB 300GB)를 넘어 triggerer 디스크가
# 만들어지지 않았다(11/16). 5Gi로 줄인다. LocalExecutor에서는 스케줄러 디스크도 workers.persistence를 따른다.
# 차트가 이 이름을 workers.celery.persistence.size로 바꿀 것이라는 경고가 나오지만 1.22.0에서는 이 이름이 동작한다.
workers:
  persistence:
    size: 5Gi
scheduler:
  serviceAccount:
    annotations:
      # Workload Identity: 이 쿠버네티스 서비스 계정이 GCP 서비스 계정 airflow로 GCS에 접근한다(이슈 #37).
      iam.gke.io/gcp-service-account: airflow@final-project-513508.iam.gserviceaccount.com
triggerer:
  serviceAccount:
    annotations:
      iam.gke.io/gcp-service-account: airflow@final-project-513508.iam.gserviceaccount.com
  persistence:
    size: 5Gi

# 작업 로그를 디스크 대신 GCS에 저장하고(60일 뒤 자동 삭제, 이슈 #50) 화면(API 서버)이 GCS에서 읽어 보여 준다.
config:
  logging:
    remote_logging: "True"
    remote_base_log_folder: "gs://final-project-513508-airflow-logs/logs"
apiServer:
  serviceAccount:
    annotations:
      iam.gke.io/gcp-service-account: airflow@final-project-513508.iam.gserviceaccount.com

dags:
  gitSync:
    enabled: true
    # 조직(asac-news-rec) 정책으로 deploy key를 쓸 수 없어, 읽기 전용 개인 토큰(fine-grained PAT)으로 HTTPS 접속한다.
    # 토큰 값은 값 파일에 넣지 않고 kubectl로 만든 Secret으로만 둔다. README 참고.
    repo: https://github.com/asac-news-rec/data-ml-pipeline.git
    branch: main
    subPath: dags
    # 차트가 Secret의 키 4개(GITSYNC_USERNAME, GITSYNC_PASSWORD, GIT_SYNC_USERNAME, GIT_SYNC_PASSWORD)를
    # 모두 참조한다(helm template로 확인). Secret에 4개를 모두 넣는다.
    credentialsSecret: airflow-git-credentials
