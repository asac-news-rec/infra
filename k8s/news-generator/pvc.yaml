# 뉴스 생성기의 중간 결과물을 두는 디스크 (이슈 #59). 베스천에서 `kubectl apply -f pvc.yaml`로 올린다.
# 마운트 경로 /mnt/news-output은 작업 Pod 쪽 설정이다(요청자: 태원).
# 크기(2Gi)와 접근 방식(ReadWriteOnce)은 이슈 #59의 답변(태원, 11/20)으로 확정했다. 보관 기간은 7일이고, 7일 지난 파일 정리는 생성기가 한다.
# Persistent Disk는 한 노드에서만 읽고 쓸 수 있다(ReadWriteOnce). 생성기는 Airflow max_active_runs=1이라 Pod가 동시에 하나만 뜬다. 2개 이상 동시에 뜨게 되면 다른 방식이 필요하다.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: news-output
  namespace: airflow
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard-rwo
  resources:
    requests:
      storage: 2Gi
