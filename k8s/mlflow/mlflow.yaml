# MLflow 서버 배포 (GKE, 네임스페이스 mlflow).
# - 기록(실험·모델 등록 정보)은 SQLite 파일로 디스크(PVC)에 저장한다. 1차 구성이며 서버는 1개만 둔다.
# - 모델 파일은 GCS(model-artifacts 버킷의 mlflow/)에 저장한다.
# - 서버가 GCS에 대신 쓰므로(--serve-artifacts) 학습 코드(클라이언트)는 GCS 권한이 필요 없다.
# - 접속 주소는 클러스터 안에서만 쓰는 ClusterIP. 사람은 베스천에서 port-forward로 접속한다.
# 적용: 베스천에서 kubectl apply -f mlflow.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: mlflow
---
# 쿠버네티스 서비스 계정. 아래 annotation으로 구글 서비스 계정(mlflow-server)의 신분을 빌려 쓴다(Workload Identity).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlflow
  namespace: mlflow
  annotations:
    iam.gke.io/gcp-service-account: mlflow-server@final-project-513508.iam.gserviceaccount.com
---
# 디스크 요청서. 파드가 죽거나 노드가 0개가 되어도 디스크와 기록은 남는다.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-data
  namespace: mlflow
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard-rwo
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: mlflow
spec:
  replicas: 1
  # 디스크(ReadWriteOnce)를 한 파드만 쓸 수 있어서, 새 파드를 띄우기 전에 옛 파드를 먼저 내린다.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      serviceAccountName: mlflow
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: mlflow
          image: asia-northeast3-docker.pkg.dev/final-project-513508/news-rec/mlflow:3.18.0
          imagePullPolicy: IfNotPresent
          args:
            - mlflow
            - server
            - --host=0.0.0.0
            - --port=5000
            - --workers=2
            - --backend-store-uri=sqlite:////mlflow/data/mlflow.db
            - --artifacts-destination=gs://final-project-513508-model-artifacts/mlflow
            - --serve-artifacts
            # 클러스터 안 주소(mlflow.mlflow.svc.cluster.local)로 접속했을 때 "Invalid Host header"로 막히면
            # 아래 줄의 주석을 풀고 허용할 주소를 적는다. (MLflow 3.x 보안 설정, 확인 필요)
            # - --allowed-hosts=mlflow.mlflow.svc.cluster.local:5000,localhost:5000
          ports:
            - containerPort: 5000
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /mlflow/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mlflow-data
---
# 클러스터 안에서만 쓰는 고정 주소. http://mlflow.mlflow.svc.cluster.local:5000
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: mlflow
spec:
  type: ClusterIP
  selector:
    app: mlflow
  ports:
    - name: http
      port: 5000
      targetPort: http
